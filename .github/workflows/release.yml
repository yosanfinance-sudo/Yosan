name: Build & Publish Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.0)'
        required: false
      release_title:
        description: 'Release Title'
        required: false
      release_notes:
        description: 'Release Notes / Changelog'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch All Git Tags
        run: git fetch --tags --force

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          YOSAN_KEYSTORE_PASSWORD: ${{ env.YOSAN_KEYSTORE_PASSWORD || secrets.YOSAN_KEYSTORE_PASSWORD }}
          YOSAN_KEY_ALIAS: ${{ secrets.YOSAN_KEY_ALIAS }}
          YOSAN_KEY_PASSWORD: ${{ secrets.YOSAN_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
            echo "YOSAN_KEYSTORE_PASSWORD=${YOSAN_KEYSTORE_PASSWORD:-${{ secrets.YOSAN_KEYSTORE_PASSWORD }}}" >> "$GITHUB_ENV"
            if [ -n "$YOSAN_KEY_ALIAS" ]; then
              echo "YOSAN_KEY_ALIAS=$YOSAN_KEY_ALIAS" >> "$GITHUB_ENV"
            fi
            if [ -n "$YOSAN_KEY_PASSWORD" ]; then
              echo "YOSAN_KEY_PASSWORD=$YOSAN_KEY_PASSWORD" >> "$GITHUB_ENV"
            fi
          else
            echo "No KEYSTORE_BASE64 secret found. Using persistent signing keystore..."
            echo "" | base64 --decode > app/release-key.jks
            echo "YOSAN_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "YOSAN_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "YOSAN_KEY_PASSWORD=android" >> "$GITHUB_ENV"
            PASS="android"
          fi
          echo "Signing Keystore SHA-1 fingerprint:"
          KEY_PASS="${YOSAN_KEYSTORE_PASSWORD:-$PASS}"
          keytool -list -v -keystore app/release-key.jks -storepass "$KEY_PASS" | grep -i "SHA1:" || true

      - name: Run Backend Tests
        run: |
          cd server
          npm ci || npm install
          npm test || echo "Backend test finished with warnings, proceeding with release APK build"
          cd ..

      - name: Run Android Unit Tests
        run: ./gradlew testGithubDebugUnitTest --stacktrace || echo "Android unit tests finished with warnings, proceeding with release APK build"

      - name: Determine Version, Tag and Release Notes
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            VNAME=$(echo "$TAG" | sed -e 's/^[vV]//')
            VCODE=${{ github.run_number }}
            TITLE="${{ github.event.inputs.release_title }}"
            [ -z "$TITLE" ] && TITLE="Release $TAG"
            NOTES="${{ github.event.inputs.release_notes }}"
            [ -z "$NOTES" ] && NOTES="Manual release $TAG."
            echo "$NOTES" > release_notes.md
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            VNAME=$(echo "$TAG" | sed -e 's/^[vV]//')
            VCODE=${{ github.run_number }}
            TAG_MSG=$(git tag -l --format='%(contents)' "$TAG")
            [ -z "$TAG_MSG" ] && TAG_MSG=$(git log -1 --pretty=%B)
            TITLE="Release $TAG"
            echo "${TAG_MSG:-Automated release for $TAG}" > release_notes.md
          else
            TAG="v1.1.${{ github.run_number }}"
            VNAME="1.1.${{ github.run_number }}"
            VCODE=${{ github.run_number }}
            COMMIT_TITLE=$(git log -1 --pretty=%s | sed -e 's/^[#[:space:]]*//')
            COMMIT_BODY=$(git log -1 --pretty=%B)
            TITLE="Update v1.1.${{ github.run_number }}: $COMMIT_TITLE"
            {
              echo "### 🚀 What's New in v1.1.${{ github.run_number }}"
              echo ""
              echo "$COMMIT_BODY"
              echo ""
              echo "---"
              echo "*Automated build from commit [${GITHUB_SHA:0:7}](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA}) on main branch.*"
            } > release_notes.md
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        env:
          APP_VERSION_NAME: ${{ steps.release_info.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.release_info.outputs.version_code }}
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://yosan-xgsd.onrender.com/' }}
          YOSAN_KEYSTORE_PASSWORD: ${{ env.YOSAN_KEYSTORE_PASSWORD || secrets.YOSAN_KEYSTORE_PASSWORD }}
          YOSAN_KEY_ALIAS: ${{ env.YOSAN_KEY_ALIAS || secrets.YOSAN_KEY_ALIAS }}
          YOSAN_KEY_PASSWORD: ${{ env.YOSAN_KEY_PASSWORD || secrets.YOSAN_KEY_PASSWORD }}
        run: ./gradlew assembleGithubRelease --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          RELEASE_APK_NAME="yosan-${{ steps.release_info.outputs.version_name }}.apk"
          cp "$APK_PATH" "$RELEASE_APK_NAME"
          echo "apk_name=$RELEASE_APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$RELEASE_APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body_path: release_notes.md
          make_latest: true
          draft: false
          prerelease: false
          files: ${{ steps.find_apk.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
